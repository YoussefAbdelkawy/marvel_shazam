<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvel Shazam</title>
<style>
  :root {
    --bg: #0b1020; --bg2: #141b33; --card: rgba(255,255,255,0.045); --line: rgba(255,255,255,0.08);
    --text: #eef1f7; --muted: #8b93a7; --faint: #5b6378;
    --red: #c8102e; --white: #f3f4f7; --blue: #0f3b8c; --amber: #e0a84a; --ok: #5fd39a;
    --shield: 220px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 30%, var(--bg2) 0%, var(--bg) 60%) fixed;
    color: var(--text); font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  header { margin-top: 28px; font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--faint); }

  /* ---------- stage: shield + status ---------- */
  #stage {
    flex: 1 0 auto; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: flex-grow .7s cubic-bezier(.2,.8,.2,1), padding .7s; padding-bottom: 40px;
  }
  body.has-result #stage { flex-grow: 0; padding: 22px 0 6px; }
  #shield-wrap { position: relative; width: var(--shield); height: var(--shield); transition: width .7s cubic-bezier(.2,.8,.2,1), height .7s cubic-bezier(.2,.8,.2,1); }
  body.has-result #shield-wrap { width: 96px; height: 96px; }
  #shield {
    position: absolute; inset: 0; border: 0; border-radius: 50%; background: none; cursor: pointer;
    filter: drop-shadow(0 18px 40px rgba(200,16,46,.28)); transition: transform .25s ease, filter .3s;
    -webkit-tap-highlight-color: transparent;
  }
  #shield:hover { transform: scale(1.03); }
  #shield:active { transform: scale(.97); }
  #shield:focus-visible { outline: 2px solid var(--white); outline-offset: 8px; }
  #shield svg { width: 100%; height: 100%; display: block; }
  .spin { transform-origin: 50% 50%; }
  body.idle .spin { animation: breathe 4s ease-in-out infinite; }
  body.listening .spin { animation: spin 1.1s linear infinite; }
  body.thinking .spin { animation: spin .45s linear infinite; }
  body.loading #shield { filter: grayscale(.8) brightness(.6); cursor: progress; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.015); } }

  /* ripples while listening, scaled by mic level */
  .ripple { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(243,244,247,.35); opacity: 0; pointer-events: none; }
  body.listening .ripple { animation: ripple 2.4s cubic-bezier(.2,.6,.3,1) infinite; }
  body.listening .ripple:nth-child(2) { animation-delay: .8s; }
  body.listening .ripple:nth-child(3) { animation-delay: 1.6s; }
  @keyframes ripple { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(calc(1.55 + var(--level, 0) * 1.4)); opacity: 0; } }

  #status { margin-top: 34px; min-height: 24px; font-size: 17px; font-weight: 500; text-align: center; transition: margin .7s, font-size .7s; }
  body.has-result #status { margin-top: 12px; font-size: 13px; color: var(--muted); font-weight: 400; }
  #dots { display: inline-flex; gap: 6px; margin-top: 12px; height: 6px; }
  #dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background .3s; }
  #dots i.on { background: var(--white); }
  body.idle #dots, body.loading #dots, body.has-result #dots { visibility: hidden; }
  #heard { margin-top: 14px; max-width: 340px; min-height: 40px; padding: 0 16px; text-align: center; font-size: 14px; line-height: 1.45; color: var(--muted); font-style: italic; opacity: 0; transition: opacity .4s; }
  #heard.show { opacity: 1; }
  body.has-result #heard { display: none; }

  /* ---------- results ---------- */
  #results { width: 100%; max-width: 420px; padding: 0 16px 24px; display: none; }
  body.has-result #results { display: block; }
  .reveal { opacity: 0; transform: translateY(18px); filter: blur(6px); }
  .reveal.in { opacity: 1; transform: none; filter: none; transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1), filter .6s; }

  .hero { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 22px 20px; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--red), var(--white) 50%, var(--blue)); }
  .hero.unsure::before { background: var(--amber); }
  .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .hero.unsure .eyebrow { color: var(--amber); }
  .hero-top { display: flex; gap: 16px; align-items: center; margin-top: 12px; }
  .hero-text { flex: 1; min-width: 0; }
  .title { font-size: 26px; font-weight: 700; line-height: 1.12; letter-spacing: -.01em; }
  .meta { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .ring { width: 72px; height: 72px; flex: none; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1) .25s; }
  .hero.unsure .ring .bar { stroke: var(--amber); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .quote { margin-top: 16px; padding-left: 12px; border-left: 2px solid var(--line); font-size: 14px; line-height: 1.5; color: #c6cbd8; font-style: italic; }
  .timeline { margin-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--faint); }
  .timeline .track { flex: 1; height: 3px; border-radius: 3px; background: var(--line); position: relative; }
  .timeline .dot { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--white); box-shadow: 0 0 0 4px rgba(243,244,247,.12); }

  .also { margin-top: 18px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); padding-left: 4px; }
  .alt { margin-top: 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .alt .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alt .pct { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .alt .sub { font-size: 12px; color: var(--faint); }
  .alt .mini { grid-column: 1 / -1; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .alt .mini i { display: block; height: 100%; width: 0; background: var(--muted); border-radius: 3px; transition: width 1s cubic-bezier(.2,.8,.2,1) .4s; }

  .empty { text-align: center; padding: 26px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; }
  .empty h2 { font-size: 20px; font-weight: 650; }
  .empty p { margin-top: 8px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .heard-line { margin-top: 18px; text-align: center; font-size: 12px; color: var(--faint); line-height: 1.5; padding: 0 8px; }
  .actions { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
  .btn { font: inherit; font-size: 14px; color: var(--text); background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: background .2s; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn.primary { background: var(--white); color: #0b1020; border-color: transparent; font-weight: 600; }
  .btn.primary:hover { background: #fff; }

  footer { padding: 0 0 18px; }
  #type-toggle { font: inherit; font-size: 12px; color: var(--faint); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  #type-form { display: none; margin-top: 10px; gap: 8px; }
  #type-form.show { display: flex; }
  #type-form input { width: 260px; font: inherit; font-size: 14px; color: var(--text); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; outline: none; user-select: text; }
  #type-form input:focus { border-color: rgba(255,255,255,.3); }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0s !important; transition-duration: 0s !important; } }
</style>
</head>
<body class="loading">
  <header>Which Marvel is this?</header>

  <main id="stage">
    <div id="shield-wrap">
      <span class="ripple"></span><span class="ripple"></span><span class="ripple"></span>
      <button id="shield" aria-label="Listen and identify">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="sheen" cx="35%" cy="28%" r="75%">
              <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
              <stop offset=".45" stop-color="#fff" stop-opacity=".06"/>
              <stop offset="1" stop-color="#000" stop-opacity=".28"/>
            </radialGradient>
            <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
              <stop offset="1" stop-color="#000" stop-opacity=".35"/>
            </linearGradient>
          </defs>
          <g class="spin">
            <circle cx="100" cy="100" r="98" fill="var(--red)"/>
            <circle cx="100" cy="100" r="78" fill="var(--white)"/>
            <circle cx="100" cy="100" r="59" fill="var(--red)"/>
            <circle cx="100" cy="100" r="40" fill="var(--blue)"/>
            <polygon fill="var(--white)" points="100,61 109.2,87.3 137.1,87.9 114.9,104.7 122.9,131.5 100,115.6 77.1,131.5 85.1,104.7 62.9,87.9 90.8,87.3"/>
          </g>
          <circle cx="100" cy="100" r="98" fill="url(#sheen)"/>
          <circle cx="100" cy="100" r="97" fill="none" stroke="url(#rim)" stroke-width="2"/>
        </svg>
      </button>
    </div>
    <div id="status" role="status" aria-live="polite">Waking up…</div>
    <div id="dots"><i></i><i></i><i></i></div>
    <div id="heard"></div>
  </main>

  <section id="results" aria-live="polite"></section>

  <footer>
    <div style="text-align:center"><button id="type-toggle">Type a line instead</button></div>
    <form id="type-form"><input id="type-input" placeholder="Paste or type some dialogue" autocomplete="off"><button class="btn" type="submit">Go</button></form>
  </footer>

<script>
const $ = s => document.querySelector(s);
const body = document.body, status = $("#status"), heard = $("#heard"), results = $("#results");
let session = null, poll = null, maxWindows = 3;

function setMode(mode) {
  body.classList.remove("idle", "listening", "thinking", "loading");
  body.classList.add(mode);
}
function setDots(n) { document.querySelectorAll("#dots i").forEach((d, i) => d.classList.toggle("on", i < n)); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => Math.min(99, Math.round(x * 100));          // never claim 100%
const pctLabel = x => x < 0.005 ? "<1%" : pct(x) + "%";

async function waitReady() {
  for (;;) {
    try {
      const s = await (await fetch("/api/status")).json();
      if (s.ready) break;
      status.textContent = s.error ? "Couldn't start: " + s.error : capital(s.stage) + "…";
    } catch (e) { status.textContent = "Starting server…"; }
    await new Promise(r => setTimeout(r, 600));
  }
  setMode("idle");
  status.textContent = "Tap the shield to identify";
  const q = new URLSearchParams(location.search).get("text");
  if (q) identifyText(q);
}
const capital = s => s.charAt(0).toUpperCase() + s.slice(1);

async function start() {
  if (body.classList.contains("loading")) return;
  if (session && !body.classList.contains("idle")) { cancel(); return; }
  clearResults();
  setMode("listening"); setDots(0);
  status.textContent = "Listening…";
  heard.classList.remove("show");
  const r = await fetch("/api/listen", { method: "POST" });
  if (!r.ok) { setMode("idle"); status.textContent = "Not ready yet"; return; }
  session = await r.json(); maxWindows = session.max_windows;
  poll = setInterval(tick, 160);
}

async function tick() {
  if (!session) return;
  const s = await (await fetch("/api/session/" + session.id)).json();
  document.documentElement.style.setProperty("--level", Math.min(1, s.level * 12).toFixed(2));
  setDots(s.window + (s.state === "listening" ? 1 : 0));
  if (s.transcript) { heard.textContent = "“" + s.transcript + "”"; heard.classList.add("show"); }
  if (s.state === "listening") {
    setMode("listening");
    status.textContent = s.window === 0 ? "Listening…" : "Not sure yet — keep it playing…";
  } else if (s.state === "thinking") {
    setMode("thinking"); status.textContent = "Thinking…";
  } else if (s.state === "done") {
    stop(); show(s.result);
  } else if (s.state === "cancelled") {
    stop(); setMode("idle"); status.textContent = "Tap the shield to identify";
  }
}
function stop() { clearInterval(poll); poll = null; session = null; }
async function cancel() {
  if (session) await fetch("/api/session/" + session.id + "/cancel", { method: "POST" });
  stop(); setMode("idle"); status.textContent = "Tap the shield to identify"; heard.classList.remove("show");
}

async function identifyText(text) {
  clearResults(); setMode("thinking"); status.textContent = "Thinking…";
  const r = await fetch("/api/identify_text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
  show(await r.json());
}

function clearResults() { body.classList.remove("has-result"); results.innerHTML = ""; }

function metaLine(c) {
  if (c.episode) return `${esc(c.year)} series · ${esc(c.episode.replace(/S0?(\d+)E0?(\d+)/, "Season $1, Episode $2"))}`;
  return `${esc(c.year)} · Movie`;
}
function trimQuote(q, n = 150) { return q.length > n ? q.slice(0, n).replace(/\s+\S*$/, "") + "…" : q; }

function show(res) {
  setMode("idle");
  body.classList.add("has-result");
  status.textContent = "Tap the shield to listen again";
  const heardLine = res.transcript ? `<p class="heard-line reveal">Heard: “${esc(trimQuote(res.transcript, 220))}”</p>` : "";
  if (res.status === "silence" || res.status === "none" || res.status === "error" || !res.candidates.length) {
    const msg = {
      silence: ["Didn’t catch any dialogue", "Turn the volume up or move closer to the speaker, then try again."],
      none: ["No Marvel match", "That doesn’t sound like anything in the collection."],
      error: ["Something went wrong", esc(res.error || "")],
    }[res.status] || ["No Marvel match", ""];
    results.innerHTML = `<div class="empty reveal"><h2>${msg[0]}</h2><p>${msg[1]}</p></div>${heardLine}
      <div class="actions reveal"><button class="btn primary" onclick="start()">${res.status === "none" ? "Keep listening" : "Try again"}</button></div>`;
    return animateIn();
  }
  const [top, ...rest] = res.candidates, unsure = res.status !== "match";
  const R = 30, C = 2 * Math.PI * R;
  const where = top.kind === "movie" ? "into the film" : "into the episode";
  results.innerHTML = `
    <article class="hero reveal ${unsure ? "unsure" : ""}">
      <div class="eyebrow">${unsure ? "Not sure — best guess" : "It’s from"}</div>
      <div class="hero-top">
        <div class="hero-text">
          <div class="title">${esc(top.title)}</div>
          <div class="meta">${metaLine(top)}</div>
        </div>
        <div class="ring" aria-label="${pct(top.confidence)}% confidence">
          <svg viewBox="0 0 72 72"><circle class="track" cx="36" cy="36" r="${R}" fill="none" stroke-width="5"/>
            <circle class="bar" cx="36" cy="36" r="${R}" fill="none" stroke-width="5" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-target="${C * (1 - top.confidence)}"/></svg>
          <b data-count="${pct(top.confidence)}">0%</b>
        </div>
      </div>
      <p class="quote">“${esc(top.quote)}”</p>
      <div class="timeline"><span>Start</span><div class="track"><span class="dot" style="left:${(top.position * 100).toFixed(1)}%"></span></div><span>~${pct(top.position)}% ${where}</span></div>
    </article>
    ${rest.length ? `<div class="also reveal">${unsure ? "Or maybe" : "Also possible"}</div>` : ""}
    ${rest.map(c => `
      <div class="alt reveal">
        <div><div class="name">${esc(c.title)}</div><div class="sub">${metaLine(c)}</div></div>
        <div class="pct">${pctLabel(c.confidence)}</div>
        <div class="mini"><i data-w="${pct(c.confidence)}"></i></div>
      </div>`).join("")}
    ${unsure ? `<div class="actions reveal"><button class="btn primary" onclick="start()">Keep listening</button></div>` : ""}
    ${heardLine}`;
  animateIn();
}

function animateIn() {
  const items = [...results.querySelectorAll(".reveal")];
  items.forEach((el, i) => setTimeout(() => el.classList.add("in"), 120 + i * 140));
  setTimeout(() => {
    results.querySelectorAll(".ring .bar").forEach(b => b.style.strokeDashoffset = b.dataset.target);
    results.querySelectorAll(".alt .mini i").forEach(b => b.style.width = b.dataset.w + "%");
    results.querySelectorAll("[data-count]").forEach(el => {
      const end = +el.dataset.count, t0 = performance.now();
      const step = t => { const k = Math.min(1, (t - t0) / 1200), e = 1 - Math.pow(1 - k, 3);
        el.textContent = Math.round(end * e) + "%"; if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }, 260);
}

$("#shield").addEventListener("click", start);
$("#type-toggle").addEventListener("click", () => { $("#type-form").classList.toggle("show"); $("#type-input").focus(); });
$("#type-form").addEventListener("submit", e => { e.preventDefault(); const t = $("#type-input").value.trim(); if (t) identifyText(t); });
waitReady();
</script>
</body>
</html>
